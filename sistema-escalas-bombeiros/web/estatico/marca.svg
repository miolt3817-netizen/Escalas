<!-- Marca EscalaFogo — capacete sobre calendário, com confirmação.
     Duas cores: MARCA (as formas) e VAZADO (o que precisa sumir no fundo).
     Formas cheias e espaçamento generoso porque a marca precisa continuar
     legível a 28px no cabeçalho, onde detalhe fino vira borrão. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img"
     aria-label="EscalaFogo">
  <!-- calotа do capacete -->
  <path fill="currentColor"
        d="M64 14c-17.7 0-32 13.9-32 31v9h64v-9c0-17.1-14.3-31-32-31Z"/>
  <!-- aba -->
  <rect x="14" y="54" width="100" height="13" rx="6.5" fill="currentColor"/>
  <!-- crista frontal vazada, dando forma ao capacete -->
  <path fill="var(--vazado, #fff)"
        d="M56 26h16v22c0 3-2.4 5-8 8-5.6-3-8-5-8-8V26Z"/>
  <!-- corpo do calendário -->
  <rect x="26" y="78" width="62" height="42" rx="7" fill="currentColor"/>
  <!-- argolas -->
  <rect x="38" y="70" width="9" height="15" rx="4.5" fill="currentColor"/>
  <rect x="67" y="70" width="9" height="15" rx="4.5" fill="currentColor"/>
  <!-- faixa superior do calendário, vazada -->
  <rect x="34" y="92" width="46" height="4" rx="2" fill="var(--vazado, #fff)"/>
  <!-- células -->
  <rect x="34" y="101" width="12" height="10" rx="3" fill="var(--vazado, #fff)"/>
  <rect x="51" y="101" width="12" height="10" rx="3" fill="var(--vazado, #fff)"/>
  <!-- confirmação -->
  <circle cx="97" cy="105" r="21" fill="var(--vazado, #fff)"/>
  <circle cx="97" cy="105" r="16" fill="currentColor"/>
  <path d="M89.5 105.5l5 5 10-10" stroke="var(--vazado, #fff)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
